name: WalkingPad tracker

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 09:17 Tbilisi time
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: run
        options: [run, test-telegram, find-chat-id]

permissions:
  contents: write

concurrency: tracker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py "${{ inputs.mode || 'run' }}"
      - name: Save memory of sent alerts
        if: ${{ (inputs.mode || 'run') == 'run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update tracker state"
          git push
